name: Preview plugins
on:
  push:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'scripts/package_plugins.py'
      - '.github/workflows/test-preview-plugins.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'scripts/package_plugins.py'
      - '.github/workflows/test-preview-plugins.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test plugin behavior
        run: node --test tests/*.test.cjs
      - name: Verify installable ZIPs
        run: python3 -m unittest discover -s tests -p 'test_*.py'
